# Lint for real problems (pyflakes F, bugbear B, pycodestyle E/W); tolerate the project's compact
# one-liners and long lines, matching ha-enabot.
line-length = 100
[lint]
select = ["E", "W", "F", "B"]
ignore = ["E701", "E702", "E501", "B008"]
[lint.per-file-ignores]
"tests/*" = ["B", "E402", "F811"]
